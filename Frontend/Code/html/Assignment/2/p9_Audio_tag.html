<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Corner</title>
</head>
<body>
    <h1>Audio Corner</h1>
    <!-- <audio src ="song audio.mp3"controls >Audio is not supported</audio> -->
    <audio src ="song audio.mp3"controls autoplay muted loop="-1">Audio is not supported</audio>
</body>
</html>
<!-- Audio Tag :
      
    1. Relative Path : A relative path specifies the location of an audio file in relation to the HTML file that references it. It is used when the audio is stored within the same project directory or a subdirectory.
    2. Absolute Path in Local Machine : An absolute path specifies the complete file path to an audio file on your local machine. It starts from the root directory and includes all folders leading to the audio file. Note that this method may not work when the HTML file is hosted online, as it relies on the local file system.
    3. Absolute Path on Internet : An absolute path on the internet specifies the full URL of an audio file hosted on a web server. It allows you to reference audio files from external sources, making them accessible regardless of where your HTML file is hosted. This is commonly used for audio files hosted on websites or content delivery networks (CDNs).
