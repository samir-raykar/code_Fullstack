<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Showcase</title>
</head>
<body>
    <h1>Video Showcase</h1>
    <video src="nature video.mp4" controls autoplay muted loop="-1" width="600" height="400">Video is not supported</video>
    <video controls width="600" height="400">
        <source src="nature video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>
</html>
<!-- Video Tag :
     
    1. Relative Path : A relative path specifies the location of a video file in relation to the HTML file that references it. It is used when the video is stored within the same project directory or a subdirectory.
    2. Absolute Path in Local Machine : An absolute path specifies the complete file path to a video file on your local machine. It starts from the root directory and includes all folders leading to the video file. Note that this method may not work when the HTML file is hosted online, as it relies on the local file system.
    3. Absolute Path on Internet : An absolute path on the internet specifies the full URL of a video file hosted on a web server. It allows you to reference video files from external sources, making them accessible regardless of where your HTML file is hosted. This is commonly used for video files hosted on websites or content delivery networks (CDNs).
