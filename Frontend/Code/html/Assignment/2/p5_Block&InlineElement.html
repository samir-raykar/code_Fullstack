<!DOCTYPE html>
<html ="en">
    <head>
        <meta charset ="UTF-8">
        <title>Blank vs Inline Elements</title>
    </head>
    <body>
        <div>
            <h2>c2w</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem, ipsum!</p>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem, <span style="background-color: yellow;">ipsum!</span></p>
        </div>
</html>
<!-- Block-level Elements :
      
    1.<div> - Division
    2.<h1> to <h6> - Headings
    3.<p> - Paragraph
    4.<ul> - Unordered List
    5.<ol> - Ordered List
    6.<li> - List Item
    7.<table> - Table
    8.<form> - Form
    9.<header> - Header Section
    10.<footer> - Footer Section -->

<!-- Inline-level Elements :
      
    1.<span> - Inline Container
    2.<a> - Anchor
    3.<img> - Image
    4.<strong> - Strong
    5.<em> - Emphasis
    6.<code> - Code
    7.<kbd> - Keyboard Input
    8.<samp> - Sample Output
    9.<var> - Variable
    10.<sub> - Subscript
    11.<sup> - Superscript -->
