<!-- Image Tag :
      
    1. Relative Path : A relative path specifies the location of an image file in relation to the HTML file that references it. It is used when the image is stored within the same project directory or a subdirectory.
    2. Absolute Path in Local Machine : An absolute path specifies the complete file path to an image on your local machine. It starts from the root directory and includes all folders leading to the image file. Note that this method may not work when the HTML file is hosted online, as it relies on the local file system.
    3. Absolute Path on Internet : An absolute path on the internet specifies the full URL of an image hosted on a web server. It allows you to reference images from external sources, making them accessible regardless of where your HTML file is hosted. This is commonly used for images hosted on websites or content delivery networks (CDNs).
