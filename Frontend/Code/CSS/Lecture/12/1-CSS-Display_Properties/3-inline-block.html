<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         div{
          height:300px;
          width:300px;
         }
         .box1{
            background-color: brown;
            display:inline-block;
            
         }
         .box2{
            background-color: yellow;
            display:none; 
             /* completely remove an element from the related layout */ 
         }
         .box3{
            background-color: rgb(50, 42, 165);
            display:inline-block;
        }
         
    </style>
</head>
<body>
    <div class="box1">
        Core2web
    </div>

    <div class="box2">
        Core2web
    </div>

    <div class="box3">
        Core2web
    </div>
</body>
</html>
