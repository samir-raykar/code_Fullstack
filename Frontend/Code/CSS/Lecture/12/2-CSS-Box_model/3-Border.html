<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .solid{
        background-color:aqua;
        height:300px;
        width:300px;
        border:20px solid black;
        }
        .double{
        background-color:aqua;
        height:300px;
        width:300px;
        border:20px double black;
        }
        .dashed{
        background-color:aqua;
        height:300px;
        width:300px;
        border:20px dashed black;
        }
        .dotted{
        background-color:aqua;
        height:300px;
        width:300px;
        border:20px dotted black;
        /* border:<line-width> || <line-style> || <color> */
        }
    </style>
</head>
<body>
    <!-- 1.solid -->
    <div class="solid">
        Core2web
    </div>
    <br>
    <!-- 2.double -->
    <div class="double">
        Core2web
    </div>
    <br>
    <!-- 3.dashed -->
    <div class="dashed">
        Core2web
    </div>
    <br>
    <!--4.dotted -->
    <div class="dotted">
        Core2web
    </div>

    
</body>
</html>
