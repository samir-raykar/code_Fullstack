<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       div{
        background-color:aqua;
        height:100px;
        width:200px;
        border:10px solid black;
        }
        .A{
            /* All sides */
            padding:20px;
        }
        .B{
            /* Top and Bottom, Left and Right */
            padding:20px 40px;
        }
        .C{
            /* Top,left&Right,bottom */
            padding:30px 30px 30px ;
        }
        .D{
            /* Top, Right, Bottom, Left */
            padding:20px 20px 20px 20px;
        }
    </style>
</head>
<body>
    <div>
        Core2web
    </div>
    <br>
    <div class="A">
        Core2web
    </div>
    <br>
    <div class="B">
        Core2web
    </div>
    <br>
    <div class="C">
        Core2web
    </div>
    <br>
    <div class="D">
        Core2web
    </div>
    
</body>
</html>
