<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

       .parent{
            font-size: 20px;
        }
        .child{
            font-size: 2em;
        }
        html{
            font-size: 16px;
        }
        .heading{
            font-size: 2rem;
        }
        .Child{
            font-size: 50%;
        }

    </style>
</head>
<body>
<div class="parent">
        <!-- 1.em -->
        <p class="child">Incubatars</p> <-- 2em = 2*20px = 40px-->
        <!-- 2.rem -->
        <p class="heading">Core2web</p> <-- 2rem = 2*16px = 32px-->
        <!-- 3.%(percentage) -->
        <p class="Child">Percentage</p> <-- 50% = 0.5*20px = 10px-->
</div>

</body>
</html>
