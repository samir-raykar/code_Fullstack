<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .vw{
            background-color: aqua;
            width: 50vw;
        }
        .vh{
            background-color: blueviolet;
            height:50dvh;
        }
        .vmin{
            background-color: green;
            width: 50vmin;
        }
        .vmax{
            background-color: purple;
            width: 50vmax;
        }
    </style>
</head>

<body>
    <div>
        <!-- 1.viewport width -->
        <p class="vw">Core2web</p>
        <!-- 2.viewport height -->
        <p class="vh">Core2web</p>
        <!-- 3.viewport minimum -->
        <p class="vmin">Core2web</p>
        <!-- 4.viewport maximum -->
        <p class="vmax">Core2web</p>
    </div>
</body>
</html>
