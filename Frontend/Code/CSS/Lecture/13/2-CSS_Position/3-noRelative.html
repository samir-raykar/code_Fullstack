<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        div{
            
            width:200px;
            height:100px;
            position:absolute;
        
        }
        .container{
            width: 500px;
            height: 500px;
            font-size:20px;
            margin:20px auto;
            border: 2px solid black;
            
        }
        .container{
            position: static;
        }
        .box1{
            left: 0px;
            top: 0px;
            background-color: red;
        }
        .box2{
            right: 0px;
            top: 0px;
            background-color: yellow;
        }
        .box3{
            bottom: 0px;
            right: 0px;
            background-color: aqua;
        }
    
         .box4{
            bottom: 0px;
            left: 0px;
            background-color: blue;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            HTML
        </div>
        <div class="box2">
            CSS
        </div>
        <div class="box3">
            js
        </div>
        <div class="box4">
            React
        </div>
    </div>
</body>
</html>
